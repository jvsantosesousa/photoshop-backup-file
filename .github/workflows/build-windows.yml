name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --onefile --noconsole --name PSDBackup --hidden-import pystray._win32 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PSDBackup
          path: dist/PSDBackup.exe
